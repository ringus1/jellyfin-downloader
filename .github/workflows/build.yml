name: Build Standalone Executables

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: jellyfin-downloader-windows-x64.exe
            binary_name: jellyfin-downloader.exe
          - os: ubuntu-latest
            artifact_name: jellyfin-downloader-linux-x64
            binary_name: jellyfin-downloader

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Poetry
        run: |
          pip install poetry
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Install PyInstaller
        run: poetry run pip install pyinstaller

      - name: Download static FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile "ffmpeg.zip"
          Expand-Archive -Path "ffmpeg.zip" -DestinationPath "ffmpeg_extracted"
          $ffmpegExe = Get-ChildItem -Path "ffmpeg_extracted" -Filter "ffmpeg.exe" -Recurse | Select-Object -First 1
          Copy-Item $ffmpegExe.FullName -Destination "ffmpeg.exe"
          Remove-Item -Recurse -Force "ffmpeg_extracted", "ffmpeg.zip"
          Write-Host "ffmpeg.exe ready: $((Get-Item ffmpeg.exe).Length) bytes"

      - name: Download static FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -L "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          cp $(find ffmpeg-master-latest-linux64-gpl -name ffmpeg -type f) ./ffmpeg
          chmod +x ./ffmpeg
          rm -rf ffmpeg.tar.xz ffmpeg-master-latest-linux64-gpl
          echo "ffmpeg ready: $(ls -lh ffmpeg)"

      - name: Build standalone executable with PyInstaller
        run: poetry run pyinstaller jellyfin-downloader.spec

      - name: Rename executable for artifact
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/jellyfin-downloader.exe dist/${{ matrix.artifact_name }}
          else
            mv dist/jellyfin-downloader dist/${{ matrix.artifact_name }}
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}

      - name: Publish Release (on Git tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.artifact_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
